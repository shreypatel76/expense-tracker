<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Dashboard — Expense Tracker</title><link rel="icon" href="assets/logo.svg" /><link rel="stylesheet" href="css/style.css" /><link rel="stylesheet" href="css/dashboard.css" /><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script></head>
<body data-protected="true">
<nav class="navbar"><div class="navbar-brand"><img src="assets/logo.svg" alt="" /> Expense Tracker</div><button class="hamburger" id="hamburger-btn"><span></span><span></span><span></span></button><div class="navbar-links" id="navbar-links"><a href="dashboard.html" class="active">Dashboard</a><a href="transactions.html">Transactions</a><a href="profile.html">Profile</a><a href="settings.html">Settings</a></div><div class="navbar-user"><img data-user-photo src="assets/default-avatar.svg" alt="" /><span data-user-name>User</span><button class="logout-btn" data-logout-btn>Logout</button></div></nav>
<div class="container"><div class="page-header"><h1>Dashboard</h1><button class="btn btn-primary" data-open-add-modal>+ Add Transaction</button></div><div class="stats-grid"><div class="stat-card income"><div class="stat-label">Total Income</div><div class="stat-value" id="stat-income">₹0</div></div><div class="stat-card expense"><div class="stat-label">Total Expenses</div><div class="stat-value" id="stat-expense">₹0</div></div><div class="stat-card"><div class="stat-label">Current Balance</div><div class="stat-value" id="stat-balance">₹0</div></div><div class="stat-card"><div class="stat-label">Transactions</div><div class="stat-value" id="stat-count">0</div></div></div><div class="panel" style="margin-bottom:24px;"><div class="stat-label">This Month's Spending</div><div class="stat-value" id="stat-month-spend" style="font-size:28px;">₹0</div></div><div class="charts-grid"><div class="panel chart-card"><h3>Expenses by Category</h3><canvas id="category-chart"></canvas></div><div class="panel chart-card"><h3>Monthly Income vs Expenses</h3><canvas id="trend-chart"></canvas></div></div><div class="panel"><h3>Recent Transactions</h3><div id="recent-list"></div></div></div>
<button class="fab" data-open-add-modal aria-label="Add transaction">+</button><div id="tx-modal-root"></div>
<script type="module" src="js/auth.js"></script><script type="module" src="js/dashboard.js"></script><script>document.getElementById("hamburger-btn").addEventListener("click",()=>document.getElementById("navbar-links").classList.toggle("open"));</script></body></html>
