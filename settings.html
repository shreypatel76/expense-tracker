<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Settings — Expense Tracker</title><link rel="icon" href="assets/logo.svg" /><link rel="stylesheet" href="css/style.css" /></head><body data-protected="true"><nav class="navbar"><div class="navbar-brand"><img src="assets/logo.svg" alt="" /> Expense Tracker</div><button class="hamburger" id="hamburger-btn"><span></span><span></span><span></span></button><div class="navbar-links" id="navbar-links"><a href="dashboard.html">Dashboard</a><a href="transactions.html">Transactions</a><a href="profile.html">Profile</a><a href="settings.html" class="active">Settings</a></div><div class="navbar-user"><img data-user-photo src="assets/default-avatar.svg" alt="" /><span data-user-name>User</span><button class="logout-btn" data-logout-btn>Logout</button></div></nav><div class="container" style="max-width:560px;"><div class="page-header"><h1>Settings</h1></div><div class="panel" style="margin-bottom:20px;"><h3>Preferences</h3><form id="settings-form"><label style="display:block; font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Display Currency</label><select id="settings-currency" style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:16px;"><option value="INR">₹ INR — Indian Rupee</option><option value="USD">$ USD — US Dollar</option><option value="EUR">€ EUR — Euro</option><option value="GBP">£ GBP — British Pound</option></select><div id="settings-message" style="display:none; color:var(--income); font-size:13px; margin-bottom:12px;"></div><button type="submit" class="btn btn-primary" id="settings-save-btn">Save Settings</button></form></div><div class="panel" style="border:1px solid #f5d5d0;"><h3 style="color:var(--expense);">Danger Zone</h3><p style="color:var(--text-muted); font-size:14px;">Permanently delete every transaction on your account. Your login and profile stay intact.</p><button class="btn" id="delete-all-btn" style="background:#fdece8; color:var(--expense);">Delete All Transactions</button></div></div><script type="module" src="js/auth.js"></script><script type="module" src="js/settings.js"></script><script>document.getElementById("hamburger-btn").addEventListener("click",()=>document.getElementById("navbar-links").classList.toggle("open"));</script></body></html>
